services:
  iahome-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iahome-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - RUINEDFOOOCUS_INTERNAL_URL=${RUINEDFOOOCUS_INTERNAL_URL:-http://matrix-stability:7870}
      # Hôte du conteneur « apprendre-autrement » (réseau Docker) — évite localhost:9001 depuis iahome-app
      - APPRENDRE_AUTREMENT_HTTP_HOST=apprendre-autrement
      - PORT=3000
      - HOSTNAME=0.0.0.0
    # Fichier d'env sur l'hôte (à côté de ce docker-compose).
    # Doit contenir STRIPE_SECRET_KEY, NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY, STRIPE_WEBHOOK_SECRET, etc.
    # Si vous utilisez env.production.local (sans point), renommez-le en .env.production.local ou copiez-le.
    env_file:
      - .env.production.local
    # Port exposé pour cloudflared (ne pas lancer `next dev -p 3000` en parallèle sur l’hôte).
    ports:
      - "3000:3000"
    volumes:
      - ./logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
    networks:
      - iahome-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.iahome.loadbalancer.server.port=3000"

  # Application Next.js « Apprendre autrement » (port interne 9001). Accès Docker : Traefik → apprendre-autrement:9001.
  # Mapping ports 127.0.0.1:9001 → si le tunnel Cloudflare vise http://127.0.0.1:9001 sans cela → 502. En `next dev -p 9001`
  # sur la machine hôte en parallèle, commentez temporairement le bloc `ports:` ci-dessous.
  apprendre-autrement:
    build:
      context: ./apprendre-autrement
      dockerfile: Dockerfile
    image: iahome-apprendre-autrement:latest
    container_name: apprendre-autrement
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=9001
      - HOSTNAME=0.0.0.0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./apprendre-autrement/public/sounds:/app/public/sounds:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:9001:9001"
    networks:
      - iahome-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9001/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.1"

  # iahome-nginx:
  #   image: nginx:alpine
  #   container_name: iahome-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #     - ./logs/nginx:/var/log/nginx
  #   depends_on:
  #     - iahome-app
  #   networks:
  #     - iahome-network
  #   healthcheck:
  #     test: ["CMD", "nginx", "-t"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

  # Les services externes (PDF, MeTube, etc.) sont maintenant gérés séparément
  # dans le dossier ../essentiels/
  # Voir: ../essentiels/docker-compose.services.yml

  traefik:
    image: traefik:v2.10
    container_name: iahome-traefik
    restart: unless-stopped
    # Linux : sans cette ligne, host.docker.internal (musetalk.yml, photomaker.yml, …) ne résout pas → 502.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@iahome.fr"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Dashboard Traefik (sécurisé)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./letsencrypt:/letsencrypt
      - /etc/localtime:/etc/localtime:ro
    networks:
      - iahome-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.1'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.iahome.fr`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"


  # Portainer - Interface de gestion Docker
  portainer:
    image: portainer/portainer-ce:latest
    container_name: iahome-portainer
    restart: unless-stopped
    command: -H unix:///var/run/docker.sock
    ports:
      - "9002:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - iahome-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.1'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.iahome.fr`)"
      - "traefik.http.routers.portainer.entrypoints=web"
      - "traefik.http.routers.portainer.service=portainer-service"
      - "traefik.http.services.portainer-service.loadbalancer.server.port=9000"

  vote:
    build:
      context: ./vote
      dockerfile: Dockerfile
    container_name: iahome-vote
    restart: unless-stopped
    env_file:
      - .env.production.local
    environment:
      - NODE_ENV=production
      - VOTE_PORT=7890
      - VOTE_PUBLIC_BASE_URL=${VOTE_PUBLIC_BASE_URL:-https://vote.iahome.fr}
    ports:
      - "7890:7890"
    networks:
      - iahome-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:7890/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Service de monitoring (optionnel)
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: iahome-prometheus
  #   restart: unless-stopped
  #   command:
  #     - '--config.file=/etc/prometheus/prometheus.yml'
  #     - '--storage.tsdb.path=/prometheus'
  #     - '--web.console.libraries=/etc/prometheus/console_libraries'
  #     - '--web.console.templates=/etc/prometheus/consoles'
  #     - '--storage.tsdb.retention.time=200h'
  #     - '--web.enable-lifecycle'
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #   networks:
  #     - iahome-network
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.prometheus.rule=Host(`prometheus.iahome.fr`)"
  #     - "traefik.http.routers.prometheus.entrypoints=websecure"
  #     - "traefik.http.routers.prometheus.tls=true"
  #     - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
  #     - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

networks:
  iahome-network:
    driver: bridge

volumes:
  letsencrypt:
  portainer_data: