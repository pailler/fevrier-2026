<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.json" />
    <title>Galerie Evenement - Photobooth</title>
    <meta name="description" content="Galerie photo evenement Photobooth." />
    <link rel="stylesheet" href="./styles.css?v=21" />
    <script src="./stay-standalone.js?v=3"></script>
  </head>
  <body>
    <main class="page">
      <section class="auth-banner ok gallery-header-row">
        <span class="gallery-header-label">Galerie événement</span>
        <a
          id="gallery-add-selfie"
          class="gallery-add-selfie-btn"
          href="./studio.html"
          aria-label="Ouvrir le studio pour ajouter un selfie à cet album"
        >
          <span class="gallery-add-selfie-icon" aria-hidden="true">📸</span>
          <span class="gallery-add-selfie-copy">
            <span class="gallery-add-selfie-title">Ajouter un selfie</span>
            <span class="gallery-add-selfie-sub">Prendre une photo et l’ajouter à l’album</span>
          </span>
        </a>
        <a
          id="gallery-add-video"
          class="gallery-add-video-btn"
          href="./video-studio.html"
          aria-label="Enregistrer une courte vidéo pour cet événement"
        >
          <span class="gallery-add-selfie-icon" aria-hidden="true">🎬</span>
          <span class="gallery-add-selfie-copy">
            <span class="gallery-add-selfie-title">Courte vidéo</span>
            <span class="gallery-add-selfie-sub">Clip jusqu’à 15 secondes</span>
          </span>
        </a>
      </section>
      <section class="features">
        <h4 id="gallery-title">Chargement de la galerie...</h4>
      </section>
      <section class="studio active">
        <article class="studio-card gallery-card">
          <div class="gallery-header">
            <h5>Photos</h5>
            <span id="gallery-count">0 photo</span>
          </div>
          <div id="gallery-grid" class="gallery-grid"></div>
        </article>
        <article class="studio-card gallery-card gallery-card-videos">
          <div class="gallery-header">
            <h5>Vidéos</h5>
            <span id="gallery-video-count">0 vidéo</span>
          </div>
          <div id="gallery-video-grid" class="gallery-grid gallery-video-grid"></div>
        </article>
      </section>
    </main>

    <div id="photo-lightbox" class="photo-lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Diaporama photo">
      <div class="photo-lightbox-backdrop" role="presentation"></div>
      <div class="photo-lightbox-chrome" aria-hidden="false">
        <button type="button" class="photo-lightbox-close" aria-label="Fermer">×</button>
        <button type="button" class="photo-lightbox-slideshow" id="photo-lightbox-slideshow" aria-pressed="false" hidden>
          ▶ Diaporama
        </button>
        <button type="button" class="photo-lightbox-nav photo-lightbox-prev" id="photo-lightbox-prev" aria-label="Photo precedente">‹</button>
        <button type="button" class="photo-lightbox-nav photo-lightbox-next" id="photo-lightbox-next" aria-label="Photo suivante">›</button>
      </div>
      <div class="photo-lightbox-content">
        <img id="photo-lightbox-img" src="" alt="" />
        <video
          id="video-lightbox-player"
          class="video-lightbox-player"
          controls
          playsinline
          preload="metadata"
          hidden
        ></video>
      </div>
      <div class="photo-lightbox-booth-bar" id="photo-lightbox-booth-bar">
        <p class="photo-lightbox-print-feedback" id="photo-lightbox-print-feedback" role="status" aria-live="polite" hidden></p>
        <button type="button" class="btn-booth-print-cta" id="photo-lightbox-booth-print" aria-label="Imprimer la photo">
          Imprimer la photo
        </button>
        <button type="button" class="photo-lightbox-print-fallback" id="photo-lightbox-print-fallback" aria-label="Aperçu et réglages du navigateur" hidden>
          Aperçu et réglages (navigateur)…
        </button>
      </div>
    </div>
    <script src="./gallery.js?v=10"></script>
  </body>
</html>
