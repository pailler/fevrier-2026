services:
  photobooth:
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7885/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    build:
      context: .
      dockerfile: Dockerfile
    container_name: photobooth-iahome
    restart: unless-stopped
    environment:
      - PHOTOBOOTH_PORT=7885
    ports:
      - "7885:7885"
    volumes:
      - ./storage:/app/storage
