<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.json" />
    <title>Galerie Evenement - Photobooth</title>
    <meta name="description" content="Galerie photo evenement Photobooth." />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./stay-standalone.js"></script>
  </head>
  <body>
    <main class="page">
      <section class="auth-banner ok gallery-header-row">
        <span>Galerie evenement</span>
        <a id="gallery-back" class="btn-link gallery-back-btn" href="#">← Retour</a>
      </section>
      <section class="features">
        <h4 id="gallery-title">Chargement de la galerie...</h4>
      </section>
      <section class="studio active">
        <article class="studio-card gallery-card">
          <div class="gallery-header">
            <h5>Photos</h5>
            <span id="gallery-count">0 photo</span>
          </div>
          <div id="gallery-grid" class="gallery-grid"></div>
        </article>
      </section>
    </main>

    <div id="photo-lightbox" class="photo-lightbox" aria-hidden="true">
      <button type="button" class="photo-lightbox-close" aria-label="Fermer">×</button>
      <img id="photo-lightbox-img" src="" alt="" />
    </div>
    <script src="./gallery.js"></script>
  </body>
</html>
