services:
  vote:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iahome-vote
    restart: unless-stopped
    ports:
      - "7890:7890"
    # Variables Supabase + optionnel VOTE_PUBLIC_BASE_URL : fichier .env à la racine du dépôt iahome
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      VOTE_PORT: "7890"
