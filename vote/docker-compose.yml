services:
  vote:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iahome-vote
    restart: unless-stopped
    ports:
      - "7890:7890"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      VOTE_PORT: "7890"
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      VOTE_PUBLIC_BASE_URL: ${VOTE_PUBLIC_BASE_URL:-http://localhost:7890}
