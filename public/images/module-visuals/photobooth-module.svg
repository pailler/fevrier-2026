<svg width="400" height="225" viewBox="0 0 400 225" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient mariage -->
  <defs>
    <linearGradient id="photobooth-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce7f3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fdf2f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbcfe8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="photobooth-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1" />
    </linearGradient>
    <filter id="photobooth-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="225" fill="url(#photobooth-bg)" rx="12"/>
  
  <!-- Decorative wedding elements -->
  <circle cx="50" cy="55" r="12" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
  <circle cx="50" cy="55" r="8" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
  <circle cx="340" cy="55" r="8" fill="#ec4899" opacity="0.2"/>
  <circle cx="345" cy="50" r="4" fill="#ec4899" opacity="0.25"/>
  <circle cx="50" cy="180" r="3" fill="#f59e0b" opacity="0.4"/>
  <circle cx="55" cy="177" r="2" fill="#ec4899" opacity="0.35"/>
  <circle cx="330" cy="190" r="10" fill="#fbcfe8" opacity="0.3"/>
  
  <!-- Photo frame (cadre photobooth) -->
  <rect x="80" y="35" width="240" height="155" fill="url(#photobooth-frame)" rx="12" filter="url(#photobooth-shadow)" stroke="#f59e0b" stroke-width="3"/>
  
  <!-- Inner frame - zone photo -->
  <rect x="95" y="50" width="210" height="125" fill="#fef9c3" rx="6"/>
  
  <!-- Silhouettes mari?s simplifi?s -->
  <ellipse cx="140" cy="110" rx="25" ry="35" fill="#fed7aa"/>
  <ellipse cx="140" cy="95" rx="18" ry="20" fill="#fed7aa"/>
  <circle cx="135" cy="85" r="8" fill="#fed7aa"/>
  
  <ellipse cx="260" cy="110" rx="25" ry="35" fill="#fecaca"/>
  <ellipse cx="260" cy="95" rx="18" ry="20" fill="#fecaca"/>
  <circle cx="265" cy="85" r="8" fill="#fecaca"/>
  
  <!-- Coeur entre les silhouettes -->
  <path d="M200 95 c-8-10-22-10-30 0-8 12 0 25 15 35 15-10 23-23 15-35-8-10-22-10-30 0z" fill="#ec4899" opacity="0.7"/>
  
  <!-- Icone appareil photo -->
  <rect x="175" y="155" width="50" height="22" fill="#7c3aed" rx="4"/>
  <circle cx="200" cy="145" r="12" fill="#7c3aed"/>
  <circle cx="200" cy="145" r="5" fill="#a78bfa"/>
  <rect x="195" y="138" width="10" height="4" fill="#7c3aed" rx="2"/>
  
  <!-- Confettis -->
  <rect x="75" y="45" width="4" height="4" fill="#ec4899" transform="rotate(15 77 47)"/>
  <rect x="315" y="50" width="3" height="3" fill="#8b5cf6" transform="rotate(-20 316 51)"/>
  <rect x="85" y="195" width="3" height="3" fill="#f59e0b" transform="rotate(45 86 196)"/>
  <rect x="305" y="185" width="4" height="4" fill="#10b981" transform="rotate(-30 307 187)"/>
</svg>
