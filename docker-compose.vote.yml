# Service Vote seul — lancer depuis la RACINE du dépôt iahome (où se trouve .env)
#   docker compose -f docker-compose.vote.yml up -d --build
#   docker compose -f docker-compose.vote.yml down

services:
  vote:
    build:
      context: ./vote
      dockerfile: Dockerfile
    container_name: iahome-vote
    restart: unless-stopped
    ports:
      - "7890:7890"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      VOTE_PORT: "7890"
